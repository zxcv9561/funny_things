<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>중력 사격장</title>
<style>
  :root{ --bg:#07080c; --panel:#12141b; --ink:#eef1f6; --dim:#7f8492; --line:rgba(255,255,255,.11);
         --acc:#6fb2f0; --hot:#e8734a; --ok:#57c98a; --gold:#e8c07a; }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center}
  .stage{position:relative;width:min(96vw,1020px)}
  canvas{width:100%;display:block;border-radius:14px;background:#05060a;
    border:1px solid var(--line);cursor:crosshair;touch-action:none}
  .hud{position:absolute;left:14px;top:12px;display:flex;gap:16px;font-size:12.5px;color:var(--dim);
    pointer-events:none;background:rgba(7,8,12,.62);padding:8px 13px;border-radius:10px;border:1px solid var(--line);
    font-variant-numeric:tabular-nums}
  .hud b{color:var(--ink);font-weight:700;font-size:14px}
  .tools{position:absolute;right:14px;top:12px;display:flex;gap:7px}
  button{background:rgba(18,20,27,.85);border:1px solid var(--line);border-radius:9px;
    padding:7px 11px;color:var(--dim);font:inherit;font-size:12px;cursor:pointer}
  button:hover{color:var(--ink);border-color:var(--acc)}
  button.on{color:var(--ink);border-color:var(--acc)}
  .tip{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);transition:opacity .6s;
    font-size:12.5px;color:var(--dim);background:rgba(7,8,12,.62);padding:8px 14px;border-radius:10px;
    border:1px solid var(--line);pointer-events:none;white-space:nowrap}
  .tip b{color:var(--ink)}
  .flash{position:absolute;inset:0;border-radius:14px;pointer-events:none;opacity:0;
    transition:opacity .12s; background:radial-gradient(circle at var(--fx,50%) var(--fy,50%),
    rgba(87,201,138,.55), transparent 45%)}
  .banner{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) scale(.9);
    font-size:34px;font-weight:800;letter-spacing:-.02em;opacity:0;pointer-events:none;
    transition:opacity .18s, transform .18s; text-shadow:0 8px 40px rgba(0,0,0,.6)}
</style>
</head>
<body>
<div class="stage">
  <canvas id="cv"></canvas>
  <div class="flash" id="flash"></div>
  <div class="banner" id="banner"></div>
  <div class="hud">
    <span>스테이지 <b id="h-stage">1</b></span>
    <span>이번 판 시도 <b id="h-try">0</b></span>
    <span>총 명중 <b id="h-hit">0</b></span>
    <span>최소 시도 기록 <b id="h-best">–</b></span>
  </div>
  <div class="tools">
    <button id="ghost" class="on">지난 궤적</button>
    <button id="sound" class="on">소리</button>
    <button id="skip">다른 판</button>
  </div>
  <div class="tip" id="tip"><b>직선으로는 안 들어갑니다</b> — 길목은 늘 막혀 있습니다 · 드래그로 조준 · 방향키 미세조정(Shift=정밀) · 스페이스 발사 · 비행 중 클릭하면 건너뜀</div>
</div>

<script>
(function(){
  "use strict";
  var $=function(id){return document.getElementById(id);};
  var cv=$('cv'), ctx=cv.getContext('2d');
  var W=1020, H=620, DPR=Math.min(2, window.devicePixelRatio||1);
  var G=2600, DT=1/240, SPMAX=430;

  function fit(){
    var r=cv.getBoundingClientRect();
    cv.style.height=Math.round(r.width*H/W)+'px';
    cv.width=Math.round(r.width*DPR); cv.height=Math.round(r.width*H/W*DPR);
    SC=cv.width/DPR/W;
  }
  var SC=1;

  /* ---------- 소리 ---------- */
  var AC=null, soundOn=true;
  function blip(f0,f1,dur,type,vol){
    if(!soundOn) return;
    try{
      if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
      var o=AC.createOscillator(), g=AC.createGain();
      o.type=type||'sine'; o.frequency.setValueAtTime(f0,AC.currentTime);
      o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),AC.currentTime+dur);
      g.gain.setValueAtTime(0,AC.currentTime);
      g.gain.linearRampToValueAtTime(vol||0.16,AC.currentTime+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+dur);
      o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime+dur+0.05);
    }catch(e){}
  }

  /* ---------- 스테이지 ---------- */
  function mulberry(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0;
    var t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t;
    return ((t^t>>>14)>>>0)/4294967296; }; }

  function makeStage(rnd, level){
    var nP = Math.min(5, 2+Math.floor(level/4));
    var tr = Math.max(13, 21-level*0.4);
    var planets=[], i, tries;
    for(i=0;i<nP;i++){
      for(tries=0;tries<300;tries++){
        var p={x:230+rnd()*(W-420), y:70+rnd()*(H-140), r:24+rnd()*32};
        p.m=p.r*p.r*0.09;
        if(Math.hypot(p.x-80,p.y-H/2)<190) continue;
        var bad=false;
        for(var j=0;j<planets.length;j++){
          var q=planets[j];
          if(Math.hypot(q.x-p.x,q.y-p.y)<q.r+p.r+72){ bad=true; break; }
        }
        if(bad) continue;
        p.hue = 200+rnd()*90;
        planets.push(p); break;
      }
    }
    // 목표를 아무 데나 놓고 '직선이 막혔나' 검사해서 버리면 대부분 탈락해 생성이 몇 초씩 걸린다.
    // 대신 처음부터 행성 뒤편(그림자)에 목표를 놓아 조건을 만족시키고 시작한다.
    var L={x:80, y:H/2}, target=null;
    for(tries=0;tries<900;tries++){
      var host=planets[(rnd()*planets.length)|0];
      if(!host) break;
      var ang=Math.atan2(host.y-L.y, host.x-L.x) + (rnd()-0.5)*0.10;
      var dist=Math.hypot(host.x-L.x, host.y-L.y) + host.r + 70 + rnd()*230;
      var c={x:L.x+Math.cos(ang)*dist, y:L.y+Math.sin(ang)*dist, r:tr};
      if(c.x<200||c.x>W-40||c.y<40||c.y>H-40) continue;
      var ok=true;
      for(j=0;j<planets.length;j++){
        var q2=planets[j];
        if(Math.hypot(q2.x-c.x,q2.y-c.y)<q2.r+52){ ok=false; break; }
      }
      if(!ok) continue;
      target=c; break;
    }
    return {planets:planets, target:target, launch:L};
  }

  function simulate(st, ang, sp, maxT, wantPath){
    var x=st.launch.x, y=st.launch.y;
    var vx=Math.cos(ang)*sp, vy=Math.sin(ang)*sp;
    var path=wantPath?[x,y]:null;
    var steps=Math.round(maxT/DT);
    for(var t=0;t<steps;t++){
      var ax=0, ay=0;
      for(var i=0;i<st.planets.length;i++){
        var p=st.planets[i];
        var dx=p.x-x, dy=p.y-y, d2=dx*dx+dy*dy, d=Math.sqrt(d2);
        if(d<p.r) return {hit:false, crash:true, path:path};
        var f=G*p.m/(d2*d); ax+=dx*f; ay+=dy*f;
      }
      vx+=ax*DT; vy+=ay*DT; x+=vx*DT; y+=vy*DT;
      if(wantPath && t%3===0){ path.push(x,y); }
      var tx=x-st.target.x, ty=y-st.target.y;
      if(tx*tx+ty*ty < st.target.r*st.target.r) return {hit:true, path:path};
      if(x<-250||x>W+250||y<-250||y>H+250) return {hit:false, out:true, path:path};
    }
    return {hit:false, timeout:true, path:path};
  }

  // 발사대에서 목표까지 직선을 그었을 때 행성이 가로막는가.
  // 안 막혀 있으면 최대 속도로 쭉 쏘는 것만으로 끝나서 게임이 성립하지 않는다.
  function straightBlocked(st){
    var L=st.launch, T=st.target;
    var dx=T.x-L.x, dy=T.y-L.y, len2=dx*dx+dy*dy;
    for(var i=0;i<st.planets.length;i++){
      var p=st.planets[i];
      var t=((p.x-L.x)*dx+(p.y-L.y)*dy)/len2;
      t=Math.max(0,Math.min(1,t));
      var cx=L.x+dx*t, cy=L.y+dy*t;
      if(Math.hypot(p.x-cx,p.y-cy) < p.r) return true;
    }
    return false;
  }

  // 목표 방향으로 거의 직선 + 고속으로 쏘는 '꼼수'가 단 한 발이라도 들어가면 그 판은 버린다.
  function cheeseHits(st){
    var direct=Math.atan2(st.target.y-st.launch.y, st.target.x-st.launch.x);
    for(var a=-0.28;a<=0.281;a+=0.010){
      for(var sp=SPMAX*0.60; sp<=SPMAX+1; sp+=SPMAX*0.030){
        if(simulate(st, direct+a, sp, 9, false).hit) return true;
      }
    }
    return false;
  }

  // 풀 수 있는 판인지 무차별 대입으로 확인한다. 못 푸는 판은 게임이 아니라 고문이다.
  function solvableRate(st, samples, rnd){
    var hits=0;
    for(var i=0;i<samples;i++){
      var ang=(rnd()*2-1)*1.35, sp=130+rnd()*(SPMAX-130);
      if(simulate(st, ang, sp, 6.5, false).hit) hits++;
    }
    return hits/samples;
  }

  var seedCounter=Math.floor(Math.random()*100000);
  // 검사를 통과한 판만 내보낸다. 예전에는 다 실패하면 마지막 후보를 그냥 돌려줘서
  // 꼼수가 통하는 판이 그대로 새어 나갔다 — 검증의 의미가 없어지는 지점이 정확히 거기였다.
  function tryMake(level, budget){
    var best=null;
    for(var k=0;k<budget;k++){
      var rnd=mulberry(++seedCounter*7919);
      var st=makeStage(rnd, level);
      if(!st.target) continue;
      if(!straightBlocked(st)) continue;      // (싼 검사) 직선 사격이 막혀 있는가
      // 싼 예선(250발)으로 대부분을 걸러내고, 통과한 것만 제대로 센다
      if(solvableRate(st, 250, mulberry(seedCounter*31337)) <= 0) continue;
      var rate=solvableRate(st, 1100, mulberry(seedCounter*104729));
      if(rate<0.005) continue;
      if(cheeseHits(st)) continue;            // (비싼) 고속 직선 꼼수가 통하는가
      st.rate=rate;
      if(rate>=0.010) return st;
      if(!best || rate>best.rate) best=st;
    }
    return best;                              // 못 찾으면 null. 절대 미검증 판을 주지 않는다.
  }
  function newStage(level){
    var st=tryMake(level, 160);
    if(st) return st;
    // 그 난이도에서 조건을 만족하는 판을 못 찾으면 난이도를 낮춰 가며 다시 찾는다
    for(var lv=level-1; lv>=1; lv--){
      st=tryMake(lv, 120);
      if(st) return st;
    }
    return tryMake(1, 400) || tryMake(1, 800);
  }  /* ---------- 상태 ---------- */
  var S={ level:1, tries:0, hits:0, best:null, st:null, ghosts:[], showGhost:true,
          aim:{ang:0, sp:250}, dragging:false, shot:null, shake:0 };

  var preloaded=null, preloadLevel=null;
  function loadStage(){
    S.st = (preloaded && preloadLevel===S.level) ? preloaded : newStage(S.level);
    preloaded=null; preloadLevel=null;
    S.tries=0; S.ghosts=[]; S.shot=null;
    S.aim={ang:0, sp:250};
    paintHud();
    // 다음 판은 미리 만들어 둔다 (판 하나 만드는 데 수백 ms가 걸려 전환이 끊기기 때문)
    setTimeout(function(){ preloadLevel=S.level+1; preloaded=newStage(S.level+1); }, 400);
  }
  function paintHud(){
    $('h-stage').textContent=S.level;
    $('h-try').textContent=S.tries;
    $('h-hit').textContent=S.hits;
    $('h-best').textContent=S.best===null?'–':S.best+'회';
  }

  function fire(){
    if(S.shot || !S.st) return;
    S.tries++; paintHud();
    var r=simulate(S.st, S.aim.ang, S.aim.sp, 9, true);
    S.shot={path:r.path, i:0, res:r}; S.fast=false;
    blip(220, 90, 0.18, 'triangle', 0.12);
  }

  function endShot(){
    var r=S.shot.res;
    S.ghosts.push(S.shot.path);
    if(S.ghosts.length>7) S.ghosts.shift();
    if(r.hit){
      S.hits++;
      if(S.best===null || S.tries<S.best) S.best=S.tries;
      banner('명중', 'var(--ok)');
      flashAt(S.st.target.x, S.st.target.y);
      blip(520, 1180, 0.3, 'sine', 0.2);
      setTimeout(function(){ blip(780, 1560, 0.24, 'sine', 0.15); }, 110);
      S.level++;
      setTimeout(loadStage, 620);
    } else if(r.crash){
      banner('추락', 'var(--hot)'); S.shake=12;
      blip(180, 40, 0.34, 'sawtooth', 0.14);
    } else {
      banner('이탈', 'var(--dim)');
      blip(140, 110, 0.2, 'sine', 0.07);
    }
    S.shot=null;
    paintHud();
  }
  var bt=0;
  function banner(text, color){
    var b=$('banner'); b.textContent=text; b.style.color=color;
    b.style.opacity=1; b.style.transform='translate(-50%,-50%) scale(1)';
    bt=performance.now();
  }
  function flashAt(x,y){
    var f=$('flash');
    f.style.setProperty('--fx',(x/W*100)+'%'); f.style.setProperty('--fy',(y/H*100)+'%');
    f.style.opacity=1; setTimeout(function(){ f.style.opacity=0; }, 160);
  }

  /* ---------- 입력 ---------- */
  function pos(e){
    var r=cv.getBoundingClientRect(), t=e.touches?e.touches[0]:e;
    return {x:(t.clientX-r.left)/r.width*W, y:(t.clientY-r.top)/r.height*H};
  }
  function setAimFrom(p){
    var dx=p.x-S.st.launch.x, dy=p.y-S.st.launch.y;
    S.aim.ang=Math.atan2(dy,dx);
    S.aim.sp=Math.max(130, Math.min(SPMAX, Math.hypot(dx,dy)*1.55));
  }
  cv.addEventListener('mousedown',function(e){ if(!S.st) return; if(S.shot){ S.fast=true; return; } S.dragging=true; setAimFrom(pos(e)); });
  window.addEventListener('mousemove',function(e){ if(S.dragging&&!S.shot) setAimFrom(pos(e)); });
  window.addEventListener('mouseup',function(){ if(S.dragging){ S.dragging=false; fire(); } });
  cv.addEventListener('touchstart',function(e){ if(S.shot) return; e.preventDefault(); S.dragging=true; setAimFrom(pos(e)); },{passive:false});
  window.addEventListener('touchmove',function(e){ if(S.dragging&&!S.shot){ e.preventDefault(); setAimFrom(pos(e)); } },{passive:false});
  window.addEventListener('touchend',function(){ if(S.dragging){ S.dragging=false; fire(); } });
  window.addEventListener('keydown',function(e){
    if(e.key===' '){ e.preventDefault(); if(S.shot) S.fast=true; else fire(); return; }
    var step = e.shiftKey?0.002:0.012;
    if(e.key==='ArrowUp'){ e.preventDefault(); S.aim.ang-=step; }
    if(e.key==='ArrowDown'){ e.preventDefault(); S.aim.ang+=step; }
    if(e.key==='ArrowRight'){ e.preventDefault(); S.aim.sp=Math.min(SPMAX,S.aim.sp+(e.shiftKey?1:6)); }
    if(e.key==='ArrowLeft'){ e.preventDefault(); S.aim.sp=Math.max(130,S.aim.sp-(e.shiftKey?1:6)); }
  });
  $('ghost').onclick=function(){ S.showGhost=!S.showGhost; this.classList.toggle('on',S.showGhost); };
  $('sound').onclick=function(){ soundOn=!soundOn; this.classList.toggle('on',soundOn);
    if(soundOn) blip(660,880,0.12,'sine',0.1); };
  $('skip').onclick=function(){ loadStage(); };

  /* ---------- 그리기 ---------- */
  function draw(){
    var c=ctx;
    if(!S.st){
      c.setTransform(DPR*SC,0,0,DPR*SC,0,0);
      c.clearRect(0,0,W,H);
      c.fillStyle='rgba(255,255,255,.55)';
      c.font='600 17px system-ui'; c.textAlign='center';
      c.fillText('판을 만드는 중…', W/2, H/2-6);
      c.fillStyle='rgba(255,255,255,.28)'; c.font='12.5px system-ui';
      c.fillText('직선으로는 못 뚫는 배치인지 확인하고 있습니다', W/2, H/2+20);
      c.textAlign='left';
      return;
    }
    c.setTransform(DPR*SC,0,0,DPR*SC,0,0);
    var sx=0, sy=0;
    if(S.shake>0){ sx=(Math.random()-.5)*S.shake; sy=(Math.random()-.5)*S.shake; S.shake*=0.86; if(S.shake<0.3) S.shake=0; }
    c.save(); c.translate(sx,sy);
    c.clearRect(-20,-20,W+40,H+40);

    // 별
    c.fillStyle='rgba(255,255,255,.10)';
    for(var i=0;i<70;i++){
      var sxx=(i*97)%W, syy=(i*181)%H;
      c.fillRect(sxx, syy, 1.4, 1.4);
    }
    var st=S.st;

    // 지난 궤적
    if(S.showGhost){
      for(var g=0;g<S.ghosts.length;g++){
        var pth=S.ghosts[g], a=0.06+0.10*(g+1)/S.ghosts.length;
        c.strokeStyle='rgba(160,190,230,'+a.toFixed(3)+')'; c.lineWidth=1.3;
        c.beginPath();
        for(var k=0;k<pth.length;k+=2){ k===0?c.moveTo(pth[0],pth[1]):c.lineTo(pth[k],pth[k+1]); }
        c.stroke();
      }
    }

    // 행성
    for(i=0;i<st.planets.length;i++){
      var p=st.planets[i];
      var gr=c.createRadialGradient(p.x-p.r*0.3,p.y-p.r*0.35,p.r*0.2,p.x,p.y,p.r);
      gr.addColorStop(0,'hsl('+p.hue+',45%,42%)');
      gr.addColorStop(1,'hsl('+p.hue+',55%,15%)');
      c.fillStyle=gr; c.beginPath(); c.arc(p.x,p.y,p.r,0,7); c.fill();
      c.strokeStyle='hsla('+p.hue+',60%,70%,.28)'; c.lineWidth=1; c.stroke();
      // 중력권 표시
      c.strokeStyle='hsla('+p.hue+',60%,70%,.07)';
      c.beginPath(); c.arc(p.x,p.y,p.r*2.4,0,7); c.stroke();
    }

    // 목표
    var tg=st.target, pulse=1+Math.sin(performance.now()/320)*0.10;
    c.strokeStyle='rgba(87,201,138,.95)'; c.lineWidth=2.4;
    c.beginPath(); c.arc(tg.x,tg.y,tg.r*pulse,0,7); c.stroke();
    c.strokeStyle='rgba(87,201,138,.30)'; c.lineWidth=1.2;
    c.beginPath(); c.arc(tg.x,tg.y,tg.r*pulse+9,0,7); c.stroke();
    c.fillStyle='rgba(87,201,138,.16)'; c.beginPath(); c.arc(tg.x,tg.y,tg.r*pulse,0,7); c.fill();

    // 발사대
    var L=st.launch;
    c.fillStyle='rgba(255,255,255,.85)';
    c.beginPath(); c.arc(L.x,L.y,7,0,7); c.fill();
    c.strokeStyle='rgba(255,255,255,.20)'; c.lineWidth=1;
    c.beginPath(); c.arc(L.x,L.y,13,0,7); c.stroke();

    // 조준
    if(!S.shot){
      var len=28+S.aim.sp*0.20;
      var ex=L.x+Math.cos(S.aim.ang)*len, ey=L.y+Math.sin(S.aim.ang)*len;
      c.strokeStyle='rgba(111,178,240,.9)'; c.lineWidth=2.2;
      c.beginPath(); c.moveTo(L.x,L.y); c.lineTo(ex,ey); c.stroke();
      c.fillStyle='rgba(111,178,240,.9)';
      c.beginPath(); c.arc(ex,ey,3.4,0,7); c.fill();
      // 세기 게이지
      var pw=(S.aim.sp-130)/(SPMAX-130);
      c.strokeStyle='rgba(255,255,255,.14)'; c.lineWidth=4; c.lineCap='round';
      c.beginPath(); c.moveTo(L.x-30,L.y+34); c.lineTo(L.x+30,L.y+34); c.stroke();
      c.strokeStyle='rgba(232,192,122,.9)';
      c.beginPath(); c.moveTo(L.x-30,L.y+34); c.lineTo(L.x-30+60*pw,L.y+34); c.stroke();
      c.lineCap='butt';
    }

    // 날아가는 포탄
    if(S.shot){
      var path=S.shot.path, n=S.shot.i;
      c.strokeStyle='rgba(232,192,122,.85)'; c.lineWidth=2;
      c.beginPath();
      for(k=0;k<=n*2 && k<path.length;k+=2){ k===0?c.moveTo(path[0],path[1]):c.lineTo(path[k],path[k+1]); }
      c.stroke();
      var ix=Math.min(n*2, path.length-2);
      c.fillStyle='#ffe9be';
      c.beginPath(); c.arc(path[ix],path[ix+1],3.6,0,7); c.fill();
      c.shadowColor='rgba(232,192,122,.9)'; c.shadowBlur=14;
      c.beginPath(); c.arc(path[ix],path[ix+1],2.2,0,7); c.fill();
      c.shadowBlur=0;
    }
    c.restore();

    var b=$('banner');
    if(performance.now()-bt>700){ b.style.opacity=0; b.style.transform='translate(-50%,-50%) scale(.9)'; }
  }

  function loop(){
    if(S.shot){
      S.shot.i += S.fast?40:4;
      if(S.shot.i*2 >= S.shot.path.length-2) endShot();
    }
    draw();
    requestAnimationFrame(loop);
  }

  window.addEventListener('resize', function(){ fit(); });
  setTimeout(function(){ $('tip').style.opacity='0.28'; }, 14000);
  fit(); requestAnimationFrame(loop);
  setTimeout(loadStage, 30);   // 로딩 화면을 한 번 그린 뒤에 만들기 시작

  window.__orbit={ get S(){return S;}, fire:fire, simulate:simulate,
    solvableRate:solvableRate, newStage:newStage, mulberry:mulberry,
    aim:function(a,s){ S.aim.ang=a; S.aim.sp=s; } };
})();
</script>
</body>
