<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한글 부수는 밀실</title>
<style>
  :root{ --bg:#12100e; --panel:#1b1815; --ink:#f4efe6; --dim:#8d8578; --line:rgba(255,255,255,.12); }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
  #stage{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
  canvas.grabbing{cursor:grabbing}
  .hud{position:fixed;left:0;right:0;top:0;padding:14px 16px;display:flex;gap:10px;
    align-items:center;flex-wrap:wrap;pointer-events:none}
  .hud > *{pointer-events:auto}
  h1{font-size:15px;margin:0 14px 0 0;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
  h1 span{color:var(--dim);font-weight:500;margin-left:8px;font-size:12.5px}
  input[type=text]{background:var(--panel);border:1px solid var(--line);border-radius:9px;
    padding:8px 11px;color:var(--ink);font:inherit;font-size:13px;width:190px;outline:none}
  input[type=text]:focus{border-color:#c98f4a}
  button{background:var(--panel);border:1px solid var(--line);border-radius:9px;
    padding:8px 12px;color:var(--ink);font:inherit;font-size:12.5px;cursor:pointer;white-space:nowrap}
  button:hover{border-color:#c98f4a}
  button[aria-pressed="true"]{background:#c98f4a;border-color:#c98f4a;color:#1b1815;font-weight:700}
  .tips{position:fixed;left:16px;bottom:14px;font-size:12px;color:var(--dim);line-height:1.85;
    pointer-events:none;max-width:min(52ch,72vw);background:rgba(18,16,14,.78);
    padding:9px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.07)}
  .tips b{color:var(--ink);font-weight:600}
  .count{position:fixed;right:16px;bottom:14px;font-size:12px;color:var(--dim);
    font-variant-numeric:tabular-nums;pointer-events:none;text-align:right;line-height:1.8;
    background:rgba(18,16,14,.78);padding:9px 12px;border-radius:10px;
    border:1px solid rgba(255,255,255,.07)}
  .flash{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);
    font-size:52px;font-weight:800;opacity:0;pointer-events:none;color:#e8c07a;
    text-shadow:0 6px 40px rgba(232,192,122,.45)}
</style>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas></div>

<div class="hud">
  <h1>한글 부수는 밀실 <span>자모는 원래 부품이었다</span></h1>
  <input type="text" id="txt" value="흥미로운" maxlength="14" spellcheck="false">
  <button id="drop">떨어뜨리기</button>
  <button id="grav" aria-pressed="true">중력 켜짐</button>
  <button id="boom">전부 분해</button>
  <button id="clear">비우기</button>
</div>

<div class="tips">
  글자를 <b>클릭</b>하면 자모로 부서집니다 · <b>드래그</b>해서 던질 수 있습니다<br>
  자음을 모음 위로 끌어다 겹치면 <b>다시 한 글자로 합쳐집니다</b> — 초성+중성, 그다음 받침 순서로
</div>
<div class="count" id="count"></div>
<div class="flash" id="flash"></div>

<script>
(function(){
  "use strict";
  var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
  var W=0,H=0,DPR=Math.min(2,window.devicePixelRatio||1);

  /* ---------- 한글 조합/분해 ---------- */
  var CHO="ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ".split('');
  var JUNG="ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ".split('');
  var JONG=["","ㄱ","ㄲ","ㄳ","ㄴ","ㄵ","ㄶ","ㄷ","ㄹ","ㄺ","ㄻ","ㄼ","ㄽ","ㄾ","ㄿ","ㅀ","ㅁ",
            "ㅂ","ㅄ","ㅅ","ㅆ","ㅇ","ㅈ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
  var BASE=0xAC00, LAST=0xD7A3;
  function isSyl(ch){ var c=ch.charCodeAt(0); return c>=BASE && c<=LAST; }
  function decompose(ch){
    var c=ch.charCodeAt(0)-BASE;
    var jong=c%28, jung=((c-jong)/28)%21, cho=(((c-jong)/28)-jung)/21;
    var out=[CHO[cho], JUNG[jung]];
    if(jong) out.push(JONG[jong]);
    return out;
  }
  function compose(cho,jung,jong){
    var ci=CHO.indexOf(cho), vi=JUNG.indexOf(jung), ti=jong?JONG.indexOf(jong):0;
    if(ci<0||vi<0||ti<0) return null;
    return String.fromCharCode(BASE + (ci*21+vi)*28 + ti);
  }
  function kind(ch){
    if(isSyl(ch)) return 'syl';
    if(CHO.indexOf(ch)>=0 || JONG.indexOf(ch)>0) return 'con';
    if(JUNG.indexOf(ch)>=0) return 'vow';
    return 'etc';
  }

  /* ---------- 물리 ---------- */
  var G=2200, REST=0.36, FRIC=0.986, WALL=0.5;
  var bodies=[];
  var PALETTE=['#e8c07a','#d98a5a','#8fbf9f','#7fa8d0','#c99ac0','#e0dcd2'];

  function radiusFor(ch){ return kind(ch)==='syl' ? 34 : 24; }
  function add(ch,x,y,vx,vy){
    if(bodies.length>220) bodies.shift();
    var b={ ch:ch, x:x, y:y, vx:vx||0, vy:vy||0, r:radiusFor(ch),
            ang:(Math.random()-.5)*0.35, angv:(Math.random()-.5)*2.4,
            col:PALETTE[(Math.random()*PALETTE.length)|0], born:performance.now(), pop:1 };
    bodies.push(b); return b;
  }

  function step(dt){
    var g = gravityOn ? G : 0;
    for(var i=0;i<bodies.length;i++){
      var b=bodies[i];
      if(b===held) continue;
      b.vy += g*dt;
      b.x += b.vx*dt; b.y += b.vy*dt;
      b.ang += b.angv*dt;
      b.vx*=FRIC; b.vy*=FRIC; b.angv*=0.99;
      if(!gravityOn){ b.vx*=0.998; b.vy*=0.998; }
      // 벽
      if(b.x<b.r){ b.x=b.r; b.vx=-b.vx*WALL; b.angv+=b.vy*0.004; }
      if(b.x>W-b.r){ b.x=W-b.r; b.vx=-b.vx*WALL; b.angv-=b.vy*0.004; }
      if(b.y>H-b.r){ b.y=H-b.r; b.vy=-b.vy*REST; b.vx*=0.9; b.angv*=0.86; if(Math.abs(b.vy)<40) b.vy=0; }
      if(b.y<b.r){ b.y=b.r; b.vy=-b.vy*WALL; }
      if(b.pop<1) b.pop=Math.min(1,b.pop+dt*4);
    }
    // 충돌
    for(var it=0; it<3; it++){
      for(var a=0;a<bodies.length;a++){
        for(var c=a+1;c<bodies.length;c++){
          var p=bodies[a], q=bodies[c];
          var dx=q.x-p.x, dy=q.y-p.y, d2=dx*dx+dy*dy, rr=p.r+q.r;
          if(d2>=rr*rr || d2===0) continue;
          var d=Math.sqrt(d2), nx=dx/d, ny=dy/d, ov=rr-d;
          var pm=(p===held)?0:1, qm=(q===held)?0:1, tm=pm+qm;
          if(tm===0) continue;
          p.x-=nx*ov*(pm/tm); p.y-=ny*ov*(pm/tm);
          q.x+=nx*ov*(qm/tm); q.y+=ny*ov*(qm/tm);
          var rvx=q.vx-p.vx, rvy=q.vy-p.vy, vn=rvx*nx+rvy*ny;
          if(vn>0) continue;
          var j=-(1+REST)*vn/tm;
          if(pm){ p.vx-=j*nx; p.vy-=j*ny; p.angv-=j*0.003; }
          if(qm){ q.vx+=j*nx; q.vy+=j*ny; q.angv+=j*0.003; }
        }
      }
    }
    // 잦아든 자모는 똑바로 세운다. ㅡ 가 / 로 누워 있으면 글자가 아니라 그림이 된다.
    // 충돌 해석이 매 반복 회전을 더하므로, 반드시 그 뒤에 돌려세워야 한다.
    if(gravityOn){
      for(var s2=0;s2<bodies.length;s2++){
        var bb=bodies[s2];
        if(bb===held) continue;
        if(Math.abs(bb.vy)>60 || Math.abs(bb.vx)>70) continue;
        var tgt=Math.round(bb.ang/(Math.PI*2))*(Math.PI*2);
        bb.angv += (tgt-bb.ang)*34*dt;
        bb.angv *= 0.72;
        if(Math.abs(tgt-bb.ang)<0.012 && Math.abs(bb.angv)<0.06){ bb.ang=tgt; bb.angv=0; }
      }
    }
  }

  /* ---------- 결합 ---------- */
  function tryMerge(b){
    if(!b) return false;
    for(var i=0;i<bodies.length;i++){
      var o=bodies[i];
      if(o===b) continue;
      var dx=o.x-b.x, dy=o.y-b.y;
      if(dx*dx+dy*dy > Math.pow((o.r+b.r)*0.62,2)) continue;
      var made=null;
      var kb=kind(b.ch), ko=kind(o.ch);
      if(kb==='con'&&ko==='vow') made=compose(b.ch,o.ch,'');
      else if(kb==='vow'&&ko==='con') made=compose(o.ch,b.ch,'');
      else if(kb==='con'&&ko==='syl'){
        var d=decompose(o.ch);
        if(d.length===2 && JONG.indexOf(b.ch)>0) made=compose(d[0],d[1],b.ch);
      } else if(kb==='syl'&&ko==='con'){
        var d2=decompose(b.ch);
        if(d2.length===2 && JONG.indexOf(o.ch)>0) made=compose(d2[0],d2[1],o.ch);
      }
      if(made){
        var nx=(b.x+o.x)/2, ny=(b.y+o.y)/2;
        var nvx=(b.vx+o.vx)/2, nvy=(b.vy+o.vy)/2;
        remove(b); remove(o);
        var nb=add(made,nx,ny,nvx,nvy);
        nb.pop=0; nb.col='#e8c07a';
        flash(made);
        merges++;
        return true;
      }
    }
    return false;
  }
  function remove(b){ var i=bodies.indexOf(b); if(i>=0) bodies.splice(i,1); if(held===b) held=null; }

  var flashEl=document.getElementById('flash'), flashT=0;
  function flash(ch){ flashEl.textContent=ch; flashT=performance.now(); }

  /* ---------- 분해 ---------- */
  function shatter(b){
    if(kind(b.ch)!=='syl') return false;
    var parts=decompose(b.ch);
    remove(b);
    parts.forEach(function(p,i){
      var a=(i/parts.length)*Math.PI*2 + Math.random();
      var nb=add(p, b.x+Math.cos(a)*18, b.y+Math.sin(a)*18,
                 b.vx+Math.cos(a)*260, b.vy+Math.sin(a)*260-120);
      nb.pop=0;
    });
    shatters++;
    return true;
  }

  /* ---------- 렌더 ---------- */
  function draw(){
    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.clearRect(0,0,W,H);
    // 바닥 그림자 라인
    var grd=ctx.createLinearGradient(0,H-120,0,H);
    grd.addColorStop(0,'rgba(255,255,255,0)'); grd.addColorStop(1,'rgba(255,255,255,.045)');
    ctx.fillStyle=grd; ctx.fillRect(0,H-120,W,120);

    for(var i=0;i<bodies.length;i++){
      var b=bodies[i];
      var s=b.pop<1 ? (0.4+0.6*b.pop) + Math.sin(b.pop*Math.PI)*0.35 : 1;
      ctx.save();
      ctx.translate(b.x,b.y); ctx.rotate(b.ang); ctx.scale(s,s);
      var isS=kind(b.ch)==='syl';
      ctx.beginPath(); ctx.arc(0,0,b.r,0,Math.PI*2);
      ctx.fillStyle= isS ? 'rgba(255,255,255,.07)' : 'rgba(255,255,255,.035)';
      ctx.fill();
      ctx.lineWidth=1.2; ctx.strokeStyle= isS ? 'rgba(255,255,255,.16)':'rgba(255,255,255,.09)';
      ctx.stroke();
      ctx.fillStyle=b.col;
      ctx.font='700 '+(b.r*1.35)+'px system-ui, -apple-system, "Malgun Gothic", sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(b.ch,0,1);
      ctx.restore();
    }
    if(held){
      ctx.beginPath(); ctx.arc(held.x,held.y,held.r+7,0,Math.PI*2);
      ctx.strokeStyle='rgba(232,192,122,.6)'; ctx.lineWidth=2; ctx.stroke();
    }
    var age=performance.now()-flashT;
    if(age<620){ flashEl.style.opacity=String(Math.max(0,1-age/620));
      flashEl.style.transform='translate(-50%,-50%) scale('+(1+age/900)+')'; }
    else flashEl.style.opacity='0';

    var syl=0,jamo=0;
    for(var k=0;k<bodies.length;k++){ if(kind(bodies[k].ch)==='syl') syl++; else jamo++; }
    document.getElementById('count').textContent =
      '글자 '+syl+' · 자모 '+jamo+'   |   부순 횟수 '+shatters+' · 합친 횟수 '+merges;
  }

  /* ---------- 루프 ---------- */
  var last=performance.now(), acc=0, shatters=0, merges=0, gravityOn=true;
  function loop(t){
    var dt=Math.min(0.032,(t-last)/1000); last=t;
    acc+=dt;
    while(acc>1/120){ step(1/120); acc-=1/120; }
    draw();
    requestAnimationFrame(loop);
  }

  /* ---------- 입력 ---------- */
  var held=null, hx=0, hy=0, px=0, py=0, moved=0, downT=0;
  function pos(e){
    var r=cv.getBoundingClientRect();
    var t=e.touches?e.touches[0]:e;
    return {x:t.clientX-r.left, y:t.clientY-r.top};
  }
  function pick(p){
    for(var i=bodies.length-1;i>=0;i--){
      var b=bodies[i], dx=p.x-b.x, dy=p.y-b.y;
      if(dx*dx+dy*dy<=b.r*b.r) return b;
    }
    return null;
  }
  function down(e){
    var p=pos(e); var b=pick(p);
    if(!b) return;
    e.preventDefault();
    held=b; hx=p.x-b.x; hy=p.y-b.y; px=p.x; py=p.y; moved=0; downT=performance.now();
    cv.classList.add('grabbing');
  }
  function move(e){
    if(!held) return;
    e.preventDefault();
    var p=pos(e);
    moved+=Math.abs(p.x-px)+Math.abs(p.y-py);
    held.vx=(p.x-px)*22; held.vy=(p.y-py)*22;
    held.x=p.x-hx; held.y=p.y-hy;
    held.angv=(p.x-px)*0.35;
    px=p.x; py=p.y;
    tryMerge(held);
  }
  function up(){
    if(!held) return;
    var b=held; held=null; cv.classList.remove('grabbing');
    if(moved<6 && performance.now()-downT<400){ shatter(b); }
    else tryMerge(b);
  }
  cv.addEventListener('mousedown',down); window.addEventListener('mousemove',move); window.addEventListener('mouseup',up);
  cv.addEventListener('touchstart',down,{passive:false}); window.addEventListener('touchmove',move,{passive:false}); window.addEventListener('touchend',up);

  /* ---------- 컨트롤 ---------- */
  function dropText(){
    var s=document.getElementById('txt').value.trim();
    if(!s) s='한글';
    var chars=s.split('').filter(function(c){ return c.trim()!==''; });
    chars.forEach(function(c,i){
      setTimeout(function(){
        var x=W*0.5 + (i-(chars.length-1)/2)*70 + (Math.random()-0.5)*20;
        var nb=add(c, Math.max(40,Math.min(W-40,x)), 90, (Math.random()-0.5)*80, 40);
        nb.pop=0;
      }, i*90);
    });
  }
  document.getElementById('drop').onclick=dropText;
  document.getElementById('txt').addEventListener('keydown',function(e){ if(e.key==='Enter') dropText(); });
  document.getElementById('clear').onclick=function(){ bodies.length=0; held=null; };
  document.getElementById('boom').onclick=function(){
    var syls=bodies.filter(function(b){ return kind(b.ch)==='syl'; });
    syls.forEach(function(b,i){ setTimeout(function(){ shatter(b); }, i*70); });
  };
  document.getElementById('grav').onclick=function(){
    gravityOn=!gravityOn;
    this.setAttribute('aria-pressed', gravityOn?'true':'false');
    this.textContent = gravityOn ? '중력 켜짐' : '무중력';
    if(!gravityOn) bodies.forEach(function(b){ b.vx+=(Math.random()-.5)*180; b.vy-=Math.random()*140; });
  };

  function resize(){
    var r=cv.getBoundingClientRect();
    W=r.width; H=r.height;
    cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  }
  window.addEventListener('resize',resize);
  resize();
  dropText();
  requestAnimationFrame(loop);

  // 디버그용 훅 (테스트에서만 사용)
  window.__sim={ bodies:bodies, add:add, shatter:shatter, tryMerge:tryMerge, decompose:decompose, compose:compose };
})();
</script>
</body>
</html>
